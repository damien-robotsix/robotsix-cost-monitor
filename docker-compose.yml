# -------------------------------------------------------------------------
# robotsix-cost-monitor — local development Compose file.
#
# `docker compose up -d --build` builds the image and runs the dashboard at
# http://localhost:8099.
#
# One-shot CLI commands override the default `serve` command:
#
#     docker compose run --rm cost-monitor summary --hours 24
#     docker compose run --rm cost-monitor reconcile
#
# Configuration is delivered via a JSON file bind-mounted from ./config; real
# Langfuse / OpenRouter keys live only in config/config.json (gitignored).
# -------------------------------------------------------------------------

services:
  cost-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Bind address and port are read from config/config.json at startup
    # (settings.server_host / settings.server_port).
    ports:
      - "8099:8080"

    volumes:
      # Config bind-mount — projects.yaml available without an image rebuild.
      - ./config:/home/app/config
      # Runtime state — reconciliation snapshots persist
      # across restarts (git-ignored ./.data on the host, mapped to /data).
      - ./.data:/data
