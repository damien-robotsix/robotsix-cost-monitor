name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Minimal default: only need to read repository contents
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    # contents: read for checkout, pull-requests: write to post dependency review comments
    permissions:
      contents: read
      pull-requests: write  # dependency-review-action posts findings as PR comments
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@47523e8aa2d34d41da060d29b57f75ab262cb840 # v1.4.0
    with:
      fail-on-severity: moderate

  python-ci:
    name: Python CI
    # Pin must be at/after robotsix-github-workflows#77, which reverted the
    # `./.github/actions/python-setup` composite action: a relative `uses:`
    # inside a reusable workflow resolves against the CALLER's checkout, so
    # pins in the 042c0c2..#77 range fail with "Can't find 'action.yml' ...
    # under .github/actions/python-setup" for every consumer repo.
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      python-version: "3.14"
      install-extras: ""
      cov-package: "robotsix_cost_monitor"
      coverage-threshold: "80"
      run-deptry: true
      run-audit: true
      run-bandit: true
      check-lock: true
      run-vulture: true
      vulture-args: '--min-confidence 80 --ignore-decorators "@field_validator,@model_validator" src/ tests/ vulture_whitelist.py'

  module-validation:
    name: Module taxonomy validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked || echo "::warning::uv sync failed (possibly offline) — will try vendored fallback"
      - name: Validate module taxonomy
        run: |
          if [ -x .venv/bin/robotsix-modules-validate ]; then
            uv run robotsix-modules-validate docs/modules.yaml
          elif uv run --no-project --with pyyaml --with jsonschema python scripts/validate_modules.py docs/modules.yaml 2>/dev/null; then
            :  # vendored fallback succeeded
          else
            echo "::warning::module taxonomy validation skipped — neither primary nor vendored validator is available"
          fi

  config-schema:
    name: Config schema freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_CACHE_DIR: .cache/uv
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run python scripts/generate_config_schema.py
      - name: Check schema is up to date
        run: git diff --exit-code config/config.schema.json

  chat-skill-table:
    name: Chat skill table consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_chat_skill_table.py

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKIP: ruff,ruff-format,mypy,vulture,detect-secrets,uv-lock-check,config-schema,conventional-pre-commit,markdownlint-cli2,hadolint,codespell,actionlint
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # The remote check-secret-str hook (language: script) runs under the
          # PATH `python3` and uses Python 3.14 syntax (PEP 758); activate a
          # 3.14 venv so it does not fall back to the runner's older python3.
          python-version: "3.14"
          activate-environment: true
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  security:
    name: Security scans
    # security-events: write needed to upload SARIF results to the Security tab
    permissions:
      contents: read
      security-events: write  # upload SARIF scan results to the Security tab
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      install-extras: ""
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"
    secrets: inherit  # zizmor: ignore[secrets-inherit] -- reusable workflow needs full secret access

  baseline:
    name: Baseline check
    # Minimal permissions: only need to read the repository
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      has-docker: true

  docker-pr-scan:
    name: Docker PR build & scan
    # Build the image and gate on fixable CRITICAL/HIGH CVEs before merge;
    # release.yml only scans after the image is pushed.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write  # upload Trivy SARIF results to Code Scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0

  # Static Dockerfile lint (hadolint) on every PR and push. This is the CI
  # gate for Dockerfile lint; the pre-commit hadolint hook stays in the
  # pre-commit job's SKIP list (local developer feedback only) so the two do
  # not double-run.
  lint-dockerfile:
    name: Lint Dockerfiles
    permissions:
      contents: read  # check out the repo to lint the Dockerfiles
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-dockerfile.yml@47523e8aa2d34d41da060d29b57f75ab262cb840 # v1.4.0
    with:
      dockerfiles: "Dockerfile Dockerfile.dev"
      failure-threshold: warning

  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-python: true
      - run: uvx zizmor@1.30.0 --min-severity medium .github/workflows/

  sbom:
    name: Generate SBOM
    # actions: read needed to download artifacts from prior jobs
    permissions:
      contents: read
      actions: read  # download build artifacts from prior jobs
    uses: $/.github/workflows/sbom.yml
    with:
      attest: false

  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: write needed for Socket.dev to post PR comments
    permissions:
      contents: read
      pull-requests: write  # Socket.dev posts firewall findings as PR comments
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f  # v1.3.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: firewall
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run coverage
      - name: Upload JS coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-coverage
          path: coverage/
