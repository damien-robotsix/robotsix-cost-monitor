# No workflow-level or job-level `permissions:` block: a called workflow
# inherits the GITHUB_TOKEN permissions granted by the *caller's* `uses:` job,
# and may only downgrade them. Declaring `permissions: {}` here explicitly
# DENIED the `id-token`/`attestations` that a caller grants for `attest: true`,
# and GitHub rejects that conflict at start-up (the Release workflow's
# start-up failure). Letting the job inherit lets each caller size the token:
# release.yml grants id-token/attestations/contents (attest runs); ci.yml can
# grant only contents (attest is skipped via `if: inputs.attest`).
name: SBOM  # zizmor: ignore[excessive-permissions] -- reusable workflow: it inherits the caller's least-privilege token, callers declare permissions

on:
  workflow_call:
    inputs:
      attest:
        description: 'Generate build provenance attestation for the SBOM'
        required: false
        type: boolean
        default: false

jobs:
  sbom:  # zizmor: ignore[excessive-permissions] -- inherits the caller's token; see workflow note above
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: .cache/uv
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - run: uv sync --locked
      - name: Generate CycloneDX SBOM
        run: uv export --format cyclonedx1.5 --frozen --extra analyst --preview-features sbom-export > sbom.cyclonedx.json
      - if: inputs.attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
