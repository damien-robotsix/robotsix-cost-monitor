name: Weekly mutation test
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:
concurrency:
  group: mutation-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  mutate:
    name: Mutation test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - run: uv sync --locked --group dev
      - run: uv run mutmut run || true
      - run: uv run mutmut results
      - run: |
          SCORE=$(uv run mutmut results | tail -1 | grep -oP '\d+\.\d+' || echo "N/A")
          echo "### Mutation score: ${SCORE}%" >> "$GITHUB_STEP_SUMMARY"
