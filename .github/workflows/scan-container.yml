name: Weekly container vulnerability rescan
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions: {}  # no workflow-level default; the job grants what it needs
jobs:
  rescan:
    name: Weekly container vulnerability rescan
    permissions:
      contents: read
      security-events: write  # upload vulnerability scan results to the Security tab
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/scan-container.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
