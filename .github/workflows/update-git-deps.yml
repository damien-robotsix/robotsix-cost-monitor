name: Update git-pinned dependencies

# Weekly bump of the first-party git-pinned robotsix-* dependencies
# (robotsix-config, robotsix-http, robotsix-llmio) via
# `uv lock --upgrade-package`. Delegates to the shared bump.yml reusable
# workflow, which mints a GitHub-App installation token (RELEASE_APP) so
# the bump PR's CI actually fires — a GITHUB_TOKEN-created PR would be
# silently suppressed by GitHub.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-git-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-git-deps:
    name: Update git-pinned Python dependencies
    permissions:
      contents: write       # push the bump branch
      pull-requests: write  # create the bump PR
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/bump.yml@b8568722fa33fba3196a0364609b4c8bbb065a83  # main
    with:
      bump-mode: deps
      packages: robotsix-config robotsix-http robotsix-llmio
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
