name: Update git-pinned dependencies

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-git-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-git-deps:
    name: Update git-pinned Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # required to push the bump branch
      pull-requests: write  # required to create the bump PR
    env:
      UV_CACHE_DIR: .cache/uv
      UV_MALWARE_CHECK: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv lock --upgrade-package robotsix-config --upgrade-package robotsix-http --upgrade-package robotsix-llmio
      - run: uv sync --group dev
      - run: uv run pytest --cov=robotsix_cost_monitor --cov-report=term-missing
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7  # zizmor: ignore[superfluous-actions]
        with:
          branch: deps/update-git-deps
          title: 'chore(deps): bump git-pinned robotsix-* dependencies'
          body: |
            Automated bump of git-pinned internal dependencies:

            - `robotsix-config`
            - `robotsix-http`
            - `robotsix-llmio`

            Generated by the weekly `update-git-deps` workflow.
          commit-message: 'chore(deps): bump git-pinned robotsix-* dependencies'
          labels: dependencies
          delete-branch: true
