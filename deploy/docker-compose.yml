# central-deploy-contract-version: 1
#
# Production deployment via robotsix-central-deploy (the deploy contract this
# file follows). The repo-root docker-compose.yml is the local-dev stack
# (BUILDS the image) and is ignored by the deployment system. Lifecycle
# (restart policy, networking, gateway routing at
# cost-monitor.deploy.robotsix.net, redeploys) is managed by central-deploy —
# no Watchtower, no restart:, no host binds. The image HEALTHCHECK is the
# canonical health probe.
#
# The dashboard has NO auth of its own and the gateway is an unauthenticated
# reverse proxy, so `settings.auth.username`/`settings.auth.password` MUST be
# set in the operator config (see config/config.schema.json). Application
# config and secrets (Langfuse projects, OpenRouter keys, auth) live in the
# mounted config file: central-deploy merges operator edits into the config
# volume and writes config.json there before the container starts (the
# config-target label below). The environment: block carries only the config
# file path pointer.
services:
  cost-monitor:
    image: ghcr.io/damien-robotsix/robotsix-cost-monitor:main
    command: serve --host 0.0.0.0 --port 8080
    labels:
      # Full in-container path of the config file (contract §5/§8): its dirname
      # must match the cost_monitor_config mount below; central-deploy resolves
      # the volume from it and writes config.json there on every config save.
      robotsix.deploy.config-target: "/home/app/config/config.json"
    ports:
      - "8099:8080"
    environment:
      # Infrastructure wiring only — where the app finds the mounted config
      # file (written by central-deploy via the config-target label above).
      ROBOTSIX_CONFIG_FILE: /home/app/config/config.json
    volumes:
      # Operator-managed runtime config, written by central-deploy.
      - cost_monitor_config:/home/app/config
      # Persistent runtime state (reconciliation snapshots, analyst proposals).
      - cost_monitor_data:/data

volumes:
  cost_monitor_config:
    labels:
      robotsix.deploy.config-target: "/home/app/config/config.json"
  cost_monitor_data:
    labels:
      robotsix.deploy.stateful: "true"
