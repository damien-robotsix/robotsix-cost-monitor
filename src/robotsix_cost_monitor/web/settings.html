<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>robotsix · settings</title>
  <link rel="stylesheet" href="/static/robotsix-ui/style.css" />
</head>
<body>
  <div id="appshell-root"></div>
  <div id="settings-root"></div>
  <script type="module">
    import { mountAppShell, mountConfigPanel } from "/static/robotsix-ui/vanilla.js";
    mountAppShell(document.getElementById("appshell-root"), {
      brand: "cost monitor",
      navItems: [
        { label: "Dashboard", href: "/", icon: "📊" },
        { label: "Settings", href: "/settings", active: true, icon: "⚙️" }
      ]
    });
    mountConfigPanel(document.getElementById("settings-root"), { title: "Settings" });
  </script>
</body>
</html>
